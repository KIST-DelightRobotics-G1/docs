# 시스템 문서 사이트 빌드 및 GitHub Pages 배포.
#
# Pages 설정: Settings → Pages → Build and deployment → Source = "GitHub Actions"
#
# 현재는 SDOC_PROFILE=public (소스 추적성 제외) 으로 빌드한다. 모든 개발 레포가
# 공개이므로 소스 포함 빌드로 바꿔도 되며, 그 경우 아래 주석 처리된
# "Fetch sources" 단계를 살리고 SDOC_PROFILE 을 지운다.
#
# 검사 정책: 문법 위반·끊어진 UID 참조는 export 자체가 실패한다(도구 특성).
# 그 외 검사는 경고(continue-on-error)로 둔다.

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install StrictDoc
        run: pip install -r requirements.txt

      # 아키텍처 도면이 ICD와 어긋나면 경고 (수정: python tools/gen_arch.py)
      - name: Check generated architecture is up to date (warning)
        continue-on-error: true
        run: python tools/gen_arch.py --check

      # 소스 포함 빌드로 전환할 때 활성화
      # - name: Fetch sources
      #   run: python tools/fetch_sources.py

      # export 자체가 검증기다. 문법 위반·끊어진 UID 참조는 여기서 실패한다.
      - name: Build documentation
        env:
          SDOC_PROFILE: public
        run: strictdoc export . --output-dir output

      # StrictDoc 결과물은 _static/ 을 쓴다. Jekyll은 언더스코어 디렉터리를 제외하므로
      # 브랜치 배포 방식으로 바뀌더라도 깨지지 않게 보험으로 남긴다.
      - name: Disable Jekyll processing
        run: touch output/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
