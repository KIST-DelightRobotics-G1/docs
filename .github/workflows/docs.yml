# 시스템 문서 사이트 빌드 및 GitHub Pages 배포.
#
# Pages 설정: Settings → Pages → Build and deployment → Source = "GitHub Actions"
#
# 소스 포함 빌드(internal 프로파일)다. tools/fetch_sources.py 가 개발 레포 8개를
# _src/ 로 받아오고, StrictDoc이 File 관계로 연결된 파일을 Source coverage 로
# 렌더링한다. 모든 개발 레포가 public 이므로 토큰이 필요 없다.
# 개발 레포가 비공개로 바뀌면 SDOC_PROFILE=public 으로 되돌린다 (소스 미포함).
#
# 검사 정책: 문법 위반·끊어진 UID 참조·없는 File 경로는 export 자체가 실패한다
# (도구 특성). 그 외 검사는 경고(continue-on-error)로 둔다.

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install StrictDoc
        run: pip install -r requirements.txt

      # 아키텍처 도면이 ICD와 어긋나면 경고 (수정: python tools/gen_arch.py)
      - name: Check generated architecture is up to date (warning)
        continue-on-error: true
        run: python tools/gen_arch.py --check

      # C4 조감도를 .drawio 원본에서 export 한다 (실패 시 커밋된 SVG 로 빌드).
      - name: Export C4 SVG from .drawio (warning on failure)
        continue-on-error: true
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs/_assets
          format: svg
          output: _export
          svg-theme: light
          embed-diagram: true
          action-mode: all
      - name: Place exported SVG (warning on failure)
        continue-on-error: true
        env:
          C4_PAGE: Temp_KIST_DRL_G1_Cortex_v0.1
        run: |
          f=$(find docs/_assets -path '*_export*' -name "*${C4_PAGE}*.svg" | head -1)
          test -n "$f" && python tools/pin_svg_light.py "$f" docs/_assets/c4_container_architecture.svg
          rm -rf docs/_assets/_export

      # File 관계가 가리키는 구현 파일. 한 레포를 못 받아도 빌드는 계속된다.
      - name: Fetch source repos into _src/
        run: python tools/fetch_sources.py

      # export 자체가 검증기다. 문법 위반·끊어진 UID·없는 File 경로는 여기서 실패한다.
      - name: Build documentation (with source traceability)
        run: strictdoc export . --output-dir output

      # StrictDoc 결과물은 _static/ 과 _source_files/ 를 쓴다. Jekyll은 언더스코어
      # 디렉터리를 제외하므로 보험으로 남긴다.
      - name: Disable Jekyll processing
        run: touch output/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
