# Vercel 배포 (GitHub Pages 대신 쓰려면).
#
# StrictDoc 빌드는 Python이 필요하므로 Vercel 빌드 이미지에 의존하지 않고
# GitHub Actions에서 빌드한 뒤 결과 디렉터리만 Vercel에 올린다.
# Vercel은 정적 파일 서빙만 담당한다.
#
# 필요한 Secrets (Vercel 대시보드 → Settings → Tokens / 프로젝트 Settings):
#   VERCEL_TOKEN       개인 액세스 토큰
#   VERCEL_ORG_ID      .vercel/project.json 의 orgId
#   VERCEL_PROJECT_ID  .vercel/project.json 의 projectId
#
# 두 ID는 로컬에서 `npx vercel link` 를 한 번 돌리면 .vercel/project.json 에 생긴다.
#
# ⚠️ Vercel Hobby(무료) 플랜은 비상업적 개인 사용만 허용한다.
#    수주 프로젝트 산출물을 고객사에 보여주는 용도는 상업적 사용에 해당하므로
#    Pro 플랜이 필요하다. 자세한 내용은 README 참고.
#
# 주의: 이 워크플로는 실제로 실행해 본 적이 없다.

name: vercel-deploy

on:
  workflow_dispatch:
  # GitHub Pages와 동시에 쓰지 않는다면 아래 주석을 해제한다.
  # push:
  #   branches: [main]

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install StrictDoc
        run: pip install -r requirements.txt

      - name: Check generated architecture is up to date
        run: python tools/gen_arch.py --check

      - name: Validate @relation markers
        run: python tools/check_markers.py --scan src/

      # 공개 프로파일 — 소스 코드가 사이트에 실리지 않는다.
      - name: Build documentation (public profile)
        env:
          SDOC_PROFILE: public
        run: strictdoc export . --output-dir output

      - name: Guard — no source code in published site
        run: |
          if [ -d output/html/_source_files ]; then
            echo "::error::_source_files/ 가 생성되었습니다. 공개 빌드에 소스가 포함됩니다."
            exit 1
          fi
          echo "ok: 게시물에 소스 파일 페이지가 없습니다."

      - name: Export UID list
        run: python tools/check_markers.py --export-uids output/html/uids.txt

      # vercel.json 을 결과물 옆에 두어야 배포 시 설정이 적용된다.
      - name: Stage Vercel config
        run: cp vercel.json output/html/vercel.json

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest deploy output/html \
            --prod --yes --archive=tgz \
            --token "${{ secrets.VERCEL_TOKEN }}"
