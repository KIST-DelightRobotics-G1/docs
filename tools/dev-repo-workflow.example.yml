# 각 개발 레포(kist-drl-g1-cortex, kist-ext-sensor-io, ...)에 넣는 워크플로 예시.
#
# .github/workflows/requirements.yml 로 복사해서 쓴다.
#
# 하는 일은 두 가지뿐이다.
#   1) 이 레포 코드의 @relation 마커가 살아있는 요구사항을 가리키는지 검증 (PR 게이트)
#   2) main에 머지되면 요구사항 레포에 재빌드를 요청
#
# 개발자는 평소처럼 자기 레포에서만 작업하면 된다. 요구사항 레포를 clone 하거나
# StrictDoc을 설치할 필요가 없다.

name: requirements

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 요구사항 레포가 배포한 유효 UID 목록과 검증 스크립트를 받아온다.
      # 요구사항 레포/사이트가 공개이므로 토큰이 필요 없다.
      - name: Fetch requirement UIDs
        run: |
          curl -fsSL -o uids.txt \
            https://<org>.github.io/kist-drl-g1-requirements/uids.txt
          curl -fsSL -o check_markers.py \
            https://raw.githubusercontent.com/<org>/kist-drl-g1-requirements/main/tools/check_markers.py

      # 오타나 삭제된 요구사항을 가리키는 마커가 있으면 PR이 막힌다.
      - name: Validate @relation markers
        run: python check_markers.py --uids uids.txt --scan .

  # main에 머지되면 요구사항 사이트를 재빌드시킨다.
  trigger-docs-rebuild:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate-markers
    runs-on: ubuntu-latest
    steps:
      - name: Notify requirements repo
        env:
          # 요구사항 레포에 repository_dispatch 권한이 있는 토큰
          GH_TOKEN: ${{ secrets.REQUIREMENTS_DISPATCH_TOKEN }}
        run: |
          gh api repos/<org>/kist-drl-g1-requirements/dispatches \
            -f event_type=source-updated \
            -F "client_payload[repo]=${{ github.repository }}" \
            -F "client_payload[sha]=${{ github.sha }}"
